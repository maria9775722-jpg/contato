<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Contato</title>
  <style>
    /* Estilos gerais do formulário */
    .contact-form {
      max-width: 600px;
      margin: 20px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333333;
    }

    .contact-form h2 {
      margin-bottom: 20px;
      color: #2c3e50;
      text-align: center;
    }

    /* Agrupamento e layout de linhas */
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* Labels e Inputs */
    .contact-form label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #4a5568;
    }

    .contact-form input[type="text"],
    .contact-form input[type="email"],
    .contact-form input[type="tel"],
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 15px;
      background-color: #f8fafc;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .contact-form input:focus,
    .contact-form select:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
      background-color: #ffffff;
    }

    .contact-form textarea {
      resize: vertical;
    }

    /* Botão de envio */
    .contact-form button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #3182ce;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .contact-form button[type="submit"]:hover {
      background-color: #2b6cb0;
    }

    .contact-form button[type="submit"]:active {
      transform: scale(0.99);
    }

    /* Responsividade para telas menores */
    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <form action="https://formspree.io/f/mnppawqz" method="POST" class="contact-form">
    <h2>Fale Conosco</h2>

    <div class="form-group">
      <label for="email">Seu e-mail:</label>
      <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
      </div>

      <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
      </div>
    </div>

    <div class="form-group">
      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco" placeholder="Rua, número e bairro">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
      </div>

      <div class="form-group">
        <label for="estado">Estado:</label>
        <select id="estado" name="estado">
          <option value="">Selecione...</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="message">Sua mensagem:</label>
      <textarea id="message" name="message" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
    </div>

    <button type="submit">Enviar</button>
  </form>

</body>
</html>
